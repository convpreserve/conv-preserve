[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "convpreserve"
version = "0.1.0"
description = "Deterministic checker for silent semantic changes when LLM API requests, responses and streams are translated between dialects"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["llm", "api-gateway", "openai", "anthropic", "gemini", "translation", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/convpreserve/conv-preserve"
Repository = "https://github.com/convpreserve/conv-preserve"
Issues = "https://github.com/convpreserve/conv-preserve/issues"

[project.scripts]
convpreserve = "convpreserve.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"convpreserve.data" = ["*.json", "*.json.gz"]
"convpreserve.judge_v13" = ["SHA256SUMS", "CHANGES_FROM_V100.md"]
