[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "convpreserve"
version = "0.1.0"
description = "Detect silent semantic changes when gateways and SDKs translate between OpenAI, Anthropic, and Gemini APIs"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["llm", "api-gateway", "openai", "anthropic", "gemini", "translation", "testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyyaml>=6.0"]

[project.urls]
Homepage = "https://convpreserve.github.io"
Repository = "https://github.com/convpreserve/conv-preserve"
Issues = "https://github.com/convpreserve/conv-preserve/issues"

[project.scripts]
convpreserve = "convpreserve.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"convpreserve.data" = ["*.json", "*.json.gz"]
"convpreserve.judge_v13" = ["SHA256SUMS", "CHANGES_FROM_V100.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
